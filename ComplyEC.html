<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ComplyEC — Préparation au contrôle qualité</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛡️</text></svg>">
<style>
:root {
  --navy: #0F1E3C;
  --navy-light: #16294f;
  --navy-lighter: #1c3260;
  --blue: #1E6FE0;
  --blue-light: #EAF2FE;
  --blue-hover: #185cc0;
  --bg: #F8F9FA;
  --card: #FFFFFF;
  --border: #E5E8EE;
  --text: #16213A;
  --text-muted: #6B7280;
  --text-faint: #9AA1AE;
  --green: #16A34A;
  --green-bg: #E7F7ED;
  --red: #DC2626;
  --red-bg: #FDECEC;
  --orange: #F59E0B;
  --orange-bg: #FEF3E1;
  --yellow: #EAB308;
  --yellow-bg: #FEFAE0;
  --blue-badge: #2563EB;
  --blue-badge-bg: #E9F1FE;
  --purple: #7C3AED;
  --purple-bg: #F1EAFE;
  --radius: 16px;
  --radius-sm: 10px;
  --radius-lg: 22px;
  --shadow: 0 1px 2px rgba(16, 24, 40, 0.04), 0 2px 6px rgba(16, 24, 40, 0.05);
  --shadow-md: 0 8px 20px rgba(16, 24, 40, 0.08), 0 2px 8px rgba(16, 24, 40, 0.06);
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
  overflow-x: hidden;
  max-width: 100%;
}

#root { min-height: 100vh; }

button {
  font-family: inherit;
  cursor: pointer;
}

input, select, textarea {
  font-family: inherit;
  font-size: 14px;
}

a { color: inherit; }

/* ---------------------------------------------------------------- Layout */

.app-shell {
  display: flex;
  min-height: 100vh;
}

.main-area {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}

.page {
  padding: 28px 32px 48px;
  max-width: 1400px;
  width: 100%;
  margin: 0 auto;
  flex: 1;
}

.page-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 22px;
  flex-wrap: wrap;
}

.page-header h1 {
  font-size: 22px;
  font-weight: 700;
  margin: 0 0 4px;
  color: var(--text);
}

.page-header .subtitle {
  color: var(--text-muted);
  font-size: 13.5px;
  margin: 0;
}

.page-header-actions {
  display: flex;
  gap: 10px;
  align-items: center;
  flex-shrink: 0;
}

/* ------------------------------------------------------------------- Nav */

.sidebar {
  width: 250px;
  flex-shrink: 0;
  background: var(--navy);
  color: #fff;
  display: flex;
  flex-direction: column;
  padding: 20px 14px;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
}

.sidebar-logo {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 10px 22px;
  font-weight: 700;
  font-size: 17px;
  letter-spacing: -0.01em;
}

.sidebar-close-btn {
  display: none;
  margin-left: auto;
  background: none;
  border: none;
  color: rgba(255,255,255,0.7);
  font-size: 16px;
  padding: 4px 8px;
}
.sidebar-close-btn:hover { color: #fff; }

/* ------------------------------------------------------------- Mobile nav */

.mobile-topbar {
  display: none;
  align-items: center;
  gap: 14px;
  position: sticky;
  top: 0;
  z-index: 40;
  background: var(--navy);
  color: #fff;
  padding: 12px 16px;
}

.hamburger-btn {
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);
  color: #fff;
  border-radius: 10px;
  width: 38px;
  height: 38px;
  font-size: 16px;
  flex-shrink: 0;
}

.mobile-topbar-logo {
  display: flex;
  align-items: center;
  gap: 9px;
  font-weight: 700;
  font-size: 16px;
}
.mobile-topbar-logo .logo-mark {
  width: 26px; height: 26px; border-radius: 8px;
  background: linear-gradient(135deg, var(--blue), #58a6ff);
  display: flex; align-items: center; justify-content: center; font-size: 13px;
  flex-shrink: 0;
}

.sidebar-backdrop {
  display: none;
}


.sidebar-logo .logo-mark {
  width: 30px;
  height: 30px;
  border-radius: 10px;
  background: linear-gradient(135deg, var(--blue), #58a6ff);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  flex-shrink: 0;
}

.sidebar-nav {
  flex: 1;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  border-radius: 10px;
  color: rgba(255,255,255,0.72);
  text-decoration: none;
  font-size: 13.5px;
  font-weight: 500;
  background: transparent;
  border: none;
  width: 100%;
  text-align: left;
  transition: background 0.12s ease, color 0.12s ease;
}

.nav-item:hover {
  background: rgba(255,255,255,0.06);
  color: #fff;
}

.nav-item.active {
  background: var(--blue);
  color: #fff;
}

.nav-item .nav-icon {
  width: 18px;
  text-align: center;
  flex-shrink: 0;
  font-size: 15px;
}

.nav-chevron {
  margin-left: auto;
  font-size: 11px;
  opacity: 0.7;
  transition: transform 0.12s ease;
}

.nav-chevron.open { transform: rotate(90deg); }

.nav-submenu {
  display: flex;
  flex-direction: column;
  gap: 1px;
  padding: 2px 0 6px 30px;
}

.nav-subitem {
  display: block;
  padding: 8px 10px;
  border-radius: 7px;
  color: rgba(255,255,255,0.6);
  font-size: 13px;
  background: none;
  border: none;
  width: 100%;
  text-align: left;
  font-family: inherit;
}

.nav-subitem:hover { background: rgba(255,255,255,0.06); color: #fff; }
.nav-subitem.active { background: rgba(30,111,224,0.35); color: #fff; font-weight: 600; }

.sidebar-footer {
  border-top: 1px solid rgba(255,255,255,0.1);
  padding-top: 14px;
  margin-top: 10px;
  display: flex;
  align-items: center;
  gap: 10px;
  padding-left: 10px;
  position: relative;
}

.avatar {
  width: 34px;
  height: 34px;
  border-radius: 50%;
  background: var(--blue);
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 12.5px;
  flex-shrink: 0;
}

.sidebar-footer-name { font-size: 13px; font-weight: 600; color: #fff; }
.sidebar-footer-role { font-size: 11.5px; color: rgba(255,255,255,0.55); }
.status-dot-row { display: flex; align-items: center; gap: 5px; font-size: 11px; color: rgba(255,255,255,0.55); margin-top: 1px; }
.status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); display: inline-block; }

.switch-space-btn {
  margin-left: auto;
  background: none;
  border: 1px solid rgba(255,255,255,0.18);
  color: rgba(255,255,255,0.7);
  border-radius: 8px;
  padding: 5px 7px;
  font-size: 12px;
}
.switch-space-btn:hover { color: #fff; border-color: rgba(255,255,255,0.4); }

/* ------------------------------------------------------------------ Cards */

.card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px 22px;
  box-shadow: var(--shadow);
  min-width: 0;
}

/* Flex/grid items default to min-width:auto, which lets wide content (tables,
   long text) force the whole track wider than its column — overriding this
   lets .table-wrap's own overflow-x:auto contain that content instead. */
.grid-2 > *, .grid-2-uneven > *, .split-layout > *, .stat-icon-row > *,
.counter-row > *, .two-col-preview > * { min-width: 0; }

.card-title {
  display: flex;
  align-items: center;
  gap: 9px;
  font-size: 14.5px;
  font-weight: 700;
  color: var(--text);
  margin: 0 0 14px;
}

.card-icon {
  width: 30px;
  height: 30px;
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  flex-shrink: 0;
}

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
.grid-2-uneven { display: grid; grid-template-columns: 1.4fr 1fr; gap: 18px; }

.card-link {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  color: var(--blue);
  font-size: 12.8px;
  font-weight: 600;
  background: none;
  border: none;
  padding: 0;
  margin-top: 12px;
}
.card-link:hover { text-decoration: underline; }

.list-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
  font-size: 13.3px;
}
.list-row:last-child { border-bottom: none; }

.list-row-label { display: flex; align-items: center; gap: 9px; color: var(--text); }
.list-row-value { font-weight: 700; color: var(--text); }

.dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.dot.rouge { background: var(--red); }
.dot.orange { background: var(--orange); }
.dot.jaune { background: var(--yellow); }
.dot.vert { background: var(--green); }
.dot.bleu { background: var(--blue-badge); }
.dot.violet { background: var(--purple); }

.bar-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; font-size: 13px; }
.bar-name { width: 100px; flex-shrink: 0; color: var(--text); }
.bar-track { flex: 1; height: 7px; background: var(--border); border-radius: 4px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 4px; }
.bar-value { width: 22px; text-align: right; font-weight: 700; color: var(--text); flex-shrink: 0; }

/* ----------------------------------------------------------------- Badges */

.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 10px;
  border-radius: 999px;
  font-size: 12px;
  font-weight: 600;
  white-space: nowrap;
}
.badge.rouge { background: var(--red-bg); color: var(--red); }
.badge.orange { background: var(--orange-bg); color: #B45309; }
.badge.jaune { background: var(--yellow-bg); color: #92730a; }
.badge.vert { background: var(--green-bg); color: var(--green); }
.badge.bleu { background: var(--blue-badge-bg); color: var(--blue-badge); }
.badge.violet { background: var(--purple-bg); color: var(--purple); }
.badge.gris { background: #F1F2F4; color: var(--text-muted); }

.pill-select {
  border-radius: 999px;
  border: 1px solid var(--border);
  padding: 4px 10px 4px 12px;
  font-size: 12.5px;
  font-weight: 600;
  background: #fff;
}

/* ----------------------------------------------------------------- Button */

.btn {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  border-radius: 12px;
  padding: 9px 16px;
  font-size: 13.5px;
  font-weight: 600;
  border: 1px solid transparent;
  transition: background 0.12s ease, border-color .12s ease, color .12s ease;
  white-space: nowrap;
}

.btn-primary { background: var(--navy); color: #fff; }
.btn-primary:hover { background: var(--navy-light); }
.btn-primary:disabled { background: #B7C0D1; cursor: not-allowed; }

.btn-accent { background: var(--blue); color: #fff; }
.btn-accent:hover { background: var(--blue-hover); }

.btn-secondary { background: #fff; color: var(--text); border-color: var(--border); }
.btn-secondary:hover { border-color: #C7CDD8; background: #FAFBFC; }

.btn-ghost { background: transparent; color: var(--blue); border-color: transparent; padding: 8px 10px; }
.btn-ghost:hover { background: var(--blue-light); }

.btn-sm { padding: 6px 11px; font-size: 12.5px; }
.btn-block { width: 100%; justify-content: center; }

/* ----------------------------------------------------------------- Table */

.table-wrap { overflow-x: auto; }

table.data-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13.3px;
}

.data-table thead th {
  text-align: left;
  color: var(--text-muted);
  font-weight: 600;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.02em;
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}

.data-table tbody td {
  padding: 13px 14px;
  border-bottom: 1px solid var(--border);
  vertical-align: middle;
  color: var(--text);
}

.data-table tbody tr:last-child td { border-bottom: none; }
.data-table tbody tr.clickable { cursor: pointer; }
.data-table tbody tr.clickable:hover { background: #FAFBFD; }
.data-table tbody tr.row-selected { background: var(--blue-light); }

.table-name { font-weight: 600; }

/* ------------------------------------------------------------------ Tabs */

.tabs {
  display: flex;
  gap: 4px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 20px;
}

.tab-btn {
  background: none;
  border: none;
  padding: 10px 16px;
  font-size: 13.5px;
  font-weight: 600;
  color: var(--text-muted);
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
}

.tab-btn:hover { color: var(--text); }
.tab-btn.active { color: var(--blue); border-bottom-color: var(--blue); }

/* -------------------------------------------------------------- Sub-tabs (vue par ...) */

.subnav {
  display: flex;
  gap: 8px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}

.subnav-btn {
  background: #fff;
  border: 1px solid var(--border);
  color: var(--text-muted);
  padding: 8px 14px;
  border-radius: 12px;
  font-size: 13px;
  font-weight: 600;
}

.subnav-btn.active { background: var(--navy); color: #fff; border-color: var(--navy); }
.subnav-btn:hover:not(.active) { border-color: #C7CDD8; }

/* ------------------------------------------------------------------ Split layout with detail drawer */

.split-layout {
  display: grid;
  grid-template-columns: 1fr;
  gap: 18px;
}

.split-layout.with-detail { grid-template-columns: 1.5fr 1fr; align-items: flex-start; }

.detail-panel {
  position: sticky;
  top: 20px;
}

.detail-panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
}

.detail-field { margin-bottom: 14px; }
.detail-field-label { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--text-faint); font-weight: 700; margin-bottom: 4px; }
.detail-field-value { font-size: 13.6px; color: var(--text); line-height: 1.5; }

.empty-detail {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  color: var(--text-faint);
  padding: 50px 20px;
  gap: 8px;
  font-size: 13px;
}
.empty-detail .empty-icon { font-size: 30px; }

/* ------------------------------------------------------------------ Forms */

.form-group { margin-bottom: 16px; }
.form-label { display: block; font-size: 12.5px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
.form-help { font-size: 11.8px; color: var(--text-faint); margin-top: 5px; }

.form-input, .form-select, .form-textarea {
  width: 100%;
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 9px 12px;
  color: var(--text);
  background: #fff;
}
.form-input:focus, .form-select:focus, .form-textarea:focus {
  outline: none;
  border-color: var(--blue);
  box-shadow: 0 0 0 3px var(--blue-light);
}

.form-textarea { resize: vertical; min-height: 76px; font-family: inherit; }

.input-with-btn { display: flex; gap: 8px; }
.input-with-btn .form-input { flex: 1; }

.checkbox-row { display: flex; align-items: center; gap: 9px; padding: 6px 0; font-size: 13.3px; }
.checkbox-row input { width: 16px; height: 16px; accent-color: var(--blue); }

.checkbox-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 20px; }

.radio-card-row { display: flex; gap: 10px; flex-wrap: wrap; }
.radio-card {
  border: 1.5px solid var(--border);
  border-radius: 14px;
  padding: 12px 16px;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-muted);
  background: #fff;
  flex: 1;
  min-width: 130px;
  justify-content: center;
}
.radio-card.selected { border-color: var(--blue); background: var(--blue-light); color: var(--blue); }

.toggle-pair { display: flex; gap: 8px; }
.toggle-btn {
  border: 1.5px solid var(--border);
  background: #fff;
  padding: 8px 18px;
  border-radius: 12px;
  font-weight: 600;
  font-size: 13px;
  color: var(--text-muted);
}
.toggle-btn.selected.yes { border-color: var(--green); background: var(--green-bg); color: var(--green); }
.toggle-btn.selected.no { border-color: var(--text-faint); background: #F1F2F4; color: var(--text); }

.info-box {
  display: flex;
  align-items: flex-start;
  gap: 9px;
  background: var(--blue-light);
  border-radius: 12px;
  padding: 11px 14px;
  font-size: 12.6px;
  color: #1a4c96;
  line-height: 1.5;
}

/* --------------------------------------------------------------- Stepper */

.stepper {
  display: flex;
  align-items: center;
  margin-bottom: 26px;
  padding: 18px 10px;
}

/* Compact progress-bar version, shown instead of the circle stepper on
   narrow screens (see the 860px media query) where the full stepper
   doesn't fit without cramping or scrolling awkwardly. */
.stepper-mobile { display: none; flex-direction: column; gap: 8px; margin-bottom: 20px; }
.stepper-mobile-track { height: 6px; border-radius: 999px; background: #EDEFF3; overflow: hidden; }
.stepper-mobile-fill { height: 100%; background: var(--blue); border-radius: 999px; transition: width 0.2s ease; }
.stepper-mobile-label { font-size: 12.5px; font-weight: 600; color: var(--text-muted); }

.stepper-step { display: flex; flex-direction: column; align-items: center; gap: 7px; position: relative; flex-shrink: 0; }
.stepper-circle {
  width: 30px; height: 30px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 12.5px; font-weight: 700;
  background: #EDEFF3; color: var(--text-faint);
  border: 2px solid #EDEFF3;
  z-index: 1;
}
.stepper-circle.done { background: var(--green); color: #fff; border-color: var(--green); }
.stepper-circle.current { background: var(--blue); color: #fff; border-color: var(--blue); }
.stepper-label { font-size: 11px; color: var(--text-faint); font-weight: 600; white-space: nowrap; }
.stepper-label.active { color: var(--text); }
.stepper-line { flex: 1; height: 2px; background: #EDEFF3; margin: 0 -2px; align-self: flex-start; margin-top: 14px; }
.stepper-line.done { background: var(--green); }

/* --------------------------------------------------------------- Wizard footer nav */

.wizard-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 22px;
}

/* --------------------------------------------------------------- Summary blocks (step 6) */

.summary-block { margin-bottom: 18px; }
.summary-block:last-child { margin-bottom: 0; }
.summary-block-title { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 13.5px; margin-bottom: 8px; }
.summary-grid { display: flex; flex-wrap: wrap; gap: 6px 26px; font-size: 12.8px; color: var(--text-muted); }
.summary-grid b { color: var(--text); font-weight: 600; }
.tag-chip { display: inline-flex; background: var(--blue-badge-bg); color: var(--blue-badge); padding: 3px 10px; border-radius: 8px; font-size: 12px; font-weight: 600; margin: 2px 5px 2px 0; }

.check-row { display: flex; align-items: center; gap: 9px; padding: 7px 0; font-size: 13.2px; color: var(--text); }
.check-row .ok-icon { color: var(--green); }

.action-row { display: flex; align-items: center; gap: 9px; padding: 6px 0; font-size: 13px; color: var(--text-muted); }

/* ---------------------------------------------------------------- misc */

.section-divider { height: 1px; background: var(--border); margin: 22px 0; }

.two-col-preview { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }

.letter-preview {
  background: #FCFCFD;
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 20px 22px;
  font-size: 12.6px;
  line-height: 1.7;
  color: var(--text);
  white-space: pre-line;
  max-height: 430px;
  overflow-y: auto;
}

.letter-preview .letter-meta { color: var(--text-muted); font-size: 12px; margin-bottom: 12px; }

.kv-line { display: flex; gap: 8px; font-size: 12.8px; padding: 3px 0; }
.kv-line .k { color: var(--text-muted); min-width: 110px; }
.kv-line .v { font-weight: 600; }

.folder-list { display: flex; flex-direction: column; gap: 8px; }
.folder-item { display: flex; align-items: center; gap: 9px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 12px; font-size: 13px; font-weight: 600; background: #FAFDFB; }
.folder-item.pending { background: #fff; color: var(--text-muted); font-weight: 500; }

.progress-banner {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--green-bg);
  color: var(--green);
  border-radius: 12px;
  padding: 11px 14px;
  font-size: 12.8px;
  font-weight: 600;
  margin-top: 14px;
}

.counter-row { display: flex; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
.counter-card {
  display: flex;
  align-items: center;
  gap: 14px;
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 16px 20px;
  flex: 1;
  min-width: 190px;
  box-shadow: var(--shadow);
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}
.counter-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
.counter-icon {
  font-size: 19px;
  width: 42px;
  height: 42px;
  border-radius: 13px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--blue-light);
  flex-shrink: 0;
}
.counter-value { font-size: 23px; font-weight: 800; color: var(--text); line-height: 1.15; }
.counter-label { font-size: 12.3px; color: var(--text-muted); }

.stat-icon-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 20px; }
.stat-icon-card {
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 16px 16px;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}
.stat-icon-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); }
.stat-icon-card .icon {
  font-size: 18px;
  margin-bottom: 10px;
  width: 36px;
  height: 36px;
  border-radius: 11px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--blue-light);
}
.stat-icon-card .stat-label { font-size: 11.8px; color: var(--text-muted); margin-bottom: 4px; }
.stat-icon-card .stat-value { font-size: 13.5px; font-weight: 700; }

.comment-box {
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 16px 18px;
  background: #FAFBFC;
}
.comment-box-title { font-weight: 700; font-size: 13px; margin-bottom: 10px; display: flex; align-items: center; gap: 7px; }
.comment-box p { font-size: 13px; line-height: 1.65; color: var(--text); margin: 0 0 10px; }
.comment-box .comment-date { font-size: 11.6px; color: var(--text-faint); }

.breadcrumb-back {
  background: none; border: none; color: var(--blue); font-size: 13px; font-weight: 600;
  display: flex; align-items: center; gap: 6px; padding: 0; margin-bottom: 14px;
}
.breadcrumb-back:hover { text-decoration: underline; }

.dropdown-menu-wrap { position: relative; display: inline-block; }
.dropdown-menu {
  position: absolute;
  right: 0;
  top: calc(100% + 4px);
  background: #fff;
  border: 1px solid var(--border);
  border-radius: 12px;
  box-shadow: var(--shadow-md);
  min-width: 190px;
  z-index: 20;
  overflow: hidden;
}
.dropdown-menu button {
  display: block;
  width: 100%;
  text-align: left;
  padding: 9px 14px;
  background: none;
  border: none;
  font-size: 12.8px;
  color: var(--text);
}
.dropdown-menu button:hover { background: var(--blue-light); }

.pagination-row { display: flex; align-items: center; justify-content: space-between; margin-top: 14px; font-size: 12.5px; color: var(--text-muted); }
.pagination-btns { display: flex; gap: 6px; }
.page-btn { border: 1px solid var(--border); background: #fff; border-radius: 8px; width: 28px; height: 28px; font-size: 12.5px; }
.page-btn.active { background: var(--navy); color: #fff; border-color: var(--navy); }

.toast {
  position: fixed;
  bottom: 26px;
  right: 26px;
  background: var(--navy);
  color: #fff;
  padding: 13px 20px;
  border-radius: 14px;
  box-shadow: var(--shadow-md);
  font-size: 13.3px;
  display: flex;
  align-items: center;
  gap: 10px;
  z-index: 100;
  animation: toast-in 0.25s ease;
}
@keyframes toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

.error-boundary {
  padding: 60px 40px;
  text-align: center;
  max-width: 560px;
  margin: 60px auto;
}
.error-boundary h2 { color: var(--red); }

::-webkit-scrollbar { width: 9px; height: 9px; }
::-webkit-scrollbar-thumb { background: #D8DCE3; border-radius: 6px; }
::-webkit-scrollbar-track { background: transparent; }

/* ------------------------------------------------------------- Folder tree */

.folder-tree { display: flex; flex-direction: column; gap: 4px; }
.folder-tree-node { display: flex; flex-direction: column; }
.folder-tree-row {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: 12px;
  font-size: 13px;
  font-weight: 600;
  background: #FAFDFB;
}
.folder-tree-row.leaf { background: #fff; font-weight: 500; color: var(--text-muted); }
.folder-tree-row .check { color: var(--green); flex-shrink: 0; }
.folder-tree-children {
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin: 4px 0 4px 22px;
  padding-left: 14px;
  border-left: 2px solid var(--border);
}

/* ------------------------------------------------------ Space selector v2 */

.select-space-screen {
  position: relative;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: radial-gradient(ellipse at top, #14264d 0%, #0a1730 55%, #060d1e 100%);
  padding: 24px;
  overflow: hidden;
}

.space-blob {
  position: absolute;
  border-radius: 50%;
  filter: blur(60px);
  opacity: 0.55;
  animation: space-blob-float 22s ease-in-out infinite alternate;
  pointer-events: none;
}
.space-blob.b1 { width: 480px; height: 480px; top: -120px; left: -100px; background: radial-gradient(circle, #2a6bf0 0%, transparent 70%); animation-duration: 26s; }
.space-blob.b2 { width: 420px; height: 420px; bottom: -140px; right: -80px; background: radial-gradient(circle, #58c7ff 0%, transparent 70%); animation-duration: 20s; animation-delay: -6s; }
.space-blob.b3 { width: 360px; height: 360px; top: 40%; left: 55%; background: radial-gradient(circle, #7c3aed 0%, transparent 70%); opacity: 0.35; animation-duration: 30s; animation-delay: -12s; }

@keyframes space-blob-float {
  0% { transform: translate(0, 0) scale(1); }
  100% { transform: translate(40px, -30px) scale(1.15); }
}

@media (prefers-reduced-motion: reduce) {
  .space-blob { animation: none; }
}

.select-space-content {
  position: relative;
  z-index: 2;
  width: 100%;
  max-width: 900px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.select-space-eyebrow {
  font-size: 11.5px;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: #8fb3ff;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.select-space-eyebrow .eyebrow-dot { width: 6px; height: 6px; border-radius: 50%; background: #58c7ff; box-shadow: 0 0 10px #58c7ff; }

.select-space-hero-title {
  font-size: 44px;
  font-weight: 800;
  letter-spacing: -0.02em;
  color: #fff;
  text-align: center;
  margin: 0 0 12px;
  text-wrap: balance;
}
.select-space-hero-title span { background: linear-gradient(135deg, #6fa8ff, #58c7ff 60%, #a78bfa); -webkit-background-clip: text; background-clip: text; color: transparent; }

.select-space-hero-sub {
  text-align: center;
  color: rgba(255,255,255,0.6);
  font-size: 15px;
  margin: 0 0 44px;
  max-width: 480px;
}

.select-space-options {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 22px;
  width: 100%;
}

.space-option {
  position: relative;
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 22px;
  padding: 30px 26px;
  text-align: left;
  background: rgba(255,255,255,0.05);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  transition: border-color 0.2s ease, transform 0.2s ease, background 0.2s ease;
  display: flex;
  flex-direction: column;
  gap: 14px;
  overflow: hidden;
}
.space-option::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(88,199,255,0.12), transparent 60%);
  opacity: 0;
  transition: opacity 0.2s ease;
}
.space-option:hover {
  border-color: rgba(88,199,255,0.5);
  background: rgba(255,255,255,0.08);
  transform: translateY(-4px);
}
.space-option:hover::before { opacity: 1; }

.space-option .avatar {
  width: 48px; height: 48px; font-size: 17px;
  box-shadow: 0 0 0 4px rgba(255,255,255,0.06);
}
.space-option-title { font-size: 16.5px; font-weight: 700; color: #fff; }
.space-option-name { font-size: 13px; color: rgba(255,255,255,0.55); }
.space-option-desc { font-size: 12.8px; color: rgba(255,255,255,0.55); line-height: 1.6; }
.space-option-cta { color: #7fc4ff; font-weight: 600; font-size: 13px; margin-top: auto; position: relative; z-index: 1; }

.select-space-footer {
  margin-top: 40px;
  font-size: 11.5px;
  color: rgba(255,255,255,0.3);
  text-align: center;
  letter-spacing: 0.02em;
}

@media (max-width: 1000px) {
  .grid-2, .grid-2-uneven, .split-layout.with-detail, .two-col-preview, .stat-icon-row { grid-template-columns: 1fr; }
  .select-space-options { grid-template-columns: 1fr; }
  .select-space-hero-title { font-size: 32px; }
}

@media (max-width: 860px) {
  .app-shell { display: block; }
  .mobile-topbar { display: flex; }
  .sidebar-close-btn { display: inline-flex; }
  .sidebar {
    position: fixed;
    top: 0;
    left: 0;
    width: 84vw;
    max-width: 300px;
    height: 100vh;
    z-index: 70;
    transform: translateX(-100%);
    transition: transform 0.25s ease;
    box-shadow: 0 0 50px rgba(0,0,0,0.4);
  }
  .sidebar.mobile-open { transform: translateX(0); }
  .sidebar-backdrop {
    display: block;
    position: fixed;
    inset: 0;
    background: rgba(6,12,26,0.55);
    z-index: 65;
  }
  .main-area { width: 100%; }
  .page { padding: 18px 16px 40px; }
  .page-header { flex-direction: column; align-items: stretch; }
  .page-header-actions { width: 100%; flex-wrap: wrap; }
  .page-header-actions .btn, .page-header-actions .pill-select { flex: 1 1 auto; min-width: 0; justify-content: center; }
  .stepper { display: none; }
  .stepper-mobile { display: flex; }
  .two-col-preview { grid-template-columns: 1fr; }
  .checkbox-grid { grid-template-columns: 1fr; }
  .radio-card-row { flex-direction: column; }
  .toggle-pair { flex-wrap: wrap; }
  table.data-table { font-size: 12.5px; }
  .wizard-footer { flex-wrap: wrap; row-gap: 10px; }
  .wizard-footer > div { flex-wrap: wrap; row-gap: 10px; width: 100%; }
  .wizard-footer .btn { flex: 1 1 auto; justify-content: center; }
  .summary-grid { column-gap: 14px; }
  .kv-line { flex-wrap: wrap; }
  .tabs { overflow-x: auto; flex-wrap: nowrap; -webkit-overflow-scrolling: touch; }
  .tab-btn { flex-shrink: 0; white-space: nowrap; }
  table.data-table { width: auto; min-width: 480px; }
}

function anomaliesParCollaborateurList() {
  return COLLABORATEURS.map(col => {
    const items = ANOMALIES.filter(a => a.collaborateur === col.id);
    const dossiers = new Set(items.map(a => a.dossier));
    const priorites = items.map(a => a.priorite);
    const prioriteMax = ['Critique', 'Haute', 'Moyenne', 'Faible'].find(p => priorites.includes(p)) || 'Faible';
    return { ...col, anomalies: items.length, dossiers: dossiers.size, prioriteMoyenne: prioriteMax, items };
  }).sort((a, b) => b.anomalies - a.anomalies);
}

function anomaliesParDossierList() {
  const dossierIds = [...new Set(ANOMALIES.map(a => a.dossier))];
  return dossierIds.map(id => {
    const items = ANOMALIES.filter(a => a.dossier === id);
    const priorites = items.map(a => a.priorite);
    const prioriteMax = ['Critique', 'Haute', 'Moyenne', 'Faible'].find(p => priorites.includes(p)) || 'Faible';

    return { dossier: client(id), anomalies: items.length, priorite: prioriteMax, collaborateur: collaborateur(collabId), items };

}

<script>
// ComplyEC — fonctions utilitaires et composants UI partagés
'use strict';

const h = React.createElement;
const { useState, useEffect, useMemo, useRef } = React;

function cx(...args) { return args.filter(Boolean).join(' '); }

function formatDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso + 'T00:00:00');
  if (isNaN(d.getTime())) return iso;
  return d.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric' });
}

function formatDateLong(iso) {
  if (!iso) return '—';
  const d = new Date(iso + 'T00:00:00');
  if (isNaN(d.getTime())) return iso;
  return d.toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });
}

function moisDepuis(iso) {
  const d = new Date(iso + 'T00:00:00');
  const now = new Date('2026-07-14T00:00:00');
  return Math.max(0, Math.round((now - d) / (1000 * 60 * 60 * 24 * 30.44)));
}

const PRIORITE_EMOJI = { Critique: '🔴', Haute: '🟠', Moyenne: '🟡', Faible: '🟢' };

// ------------------------------------------------------------- Toast (global)

function useToast() {
  const [toast, setToast] = useState(null);
  const timerRef = useRef(null);
  function showToast(message) {
    if (timerRef.current) clearTimeout(timerRef.current);
    setToast(message);
    timerRef.current = setTimeout(() => setToast(null), 3200);
  }
  const node = toast ? h('div', { className: 'toast' }, h('span', null, '✅'), toast) : null;
  return [node, showToast];
}

// ------------------------------------------------------------------- Badges

function Badge({ color = 'gris', children }) {
  return h('span', { className: cx('badge', color) }, children);
}

function PriorityBadge({ priorite }) {
  const color = PRIORITE_COULEURS[priorite] || 'gris';
  return h('span', { className: cx('badge', color) }, PRIORITE_EMOJI[priorite] || '', ' ', priorite);
}

function StatutBadge({ statut }) {
  const info = STATUT_LABELS[statut] || { label: statut, couleur: 'gris' };
  return h('span', { className: cx('badge', info.couleur) }, info.label);
}

function Dot({ color }) { return h('span', { className: cx('dot', color) }); }

// -------------------------------------------------------------------- Card

function Card(props) {
  const { title, icon, iconBg, iconColor, children, footer, style } = props;
  return h('div', { className: 'card', style },
    title ? h('div', { className: 'card-title' },
      icon ? h('span', { className: 'card-icon', style: { background: iconBg || 'var(--blue-light)', color: iconColor || 'var(--blue)' } }, icon) : null,
      title
    ) : null,
    children,
    footer || null
  );
}

// --------------------------------------------------------------- Empty state

function EmptyDetail({ icon = '👈', label = 'Sélectionnez une ligne pour voir le détail' }) {
  return h('div', { className: 'empty-detail' }, h('div', { className: 'empty-icon' }, icon), h('div', null, label));
}

// ------------------------------------------------------------------ Pagination

function usePagination(items, pageSize = 5) {
  const [page, setPage] = useState(1);
  const totalPages = Math.max(1, Math.ceil(items.length / pageSize));
  const clampedPage = Math.min(page, totalPages);
  const start = (clampedPage - 1) * pageSize;
  const pageItems = items.slice(start, start + pageSize);
  return {
    pageItems, page: clampedPage, totalPages, setPage,
    rangeLabel: items.length === 0 ? '0 résultat' : `${start + 1}-${Math.min(start + pageSize, items.length)} sur ${items.length}`,
  };
}

function Pagination({ pagination }) {
  if (pagination.totalPages <= 1) return null;
  const pages = Array.from({ length: pagination.totalPages }, (_, i) => i + 1);
  return h('div', { className: 'pagination-row' },
    h('span', null, pagination.rangeLabel),
    h('div', { className: 'pagination-btns' },
      pages.map(p => h('button', {
        key: p,
        className: cx('page-btn', p === pagination.page && 'active'),
        onClick: () => pagination.setPage(p),
      }, p))
    )
  );
}

// ---------------------------------------------------------------- Stepper

function Stepper({ steps, current }) {
  const pct = Math.round(((current - 1) / (steps.length - 1)) * 100);
  return h(React.Fragment, null,
    h('div', { className: 'stepper' },
      steps.map((label, i) => {
        const idx = i + 1;
        const done = idx < current;
        const isCurrent = idx === current;
        return h(React.Fragment, { key: idx },
          h('div', { className: 'stepper-step' },
            h('div', { className: cx('stepper-circle', done && 'done', isCurrent && 'current') }, done ? '✓' : idx),
            h('div', { className: cx('stepper-label', (done || isCurrent) && 'active') }, label)
          ),
          i < steps.length - 1 ? h('div', { className: cx('stepper-line', done && 'done') }) : null
        );
      })
    ),
    h('div', { className: 'stepper-mobile' },
      h('div', { className: 'stepper-mobile-label' }, `Étape ${current} sur ${steps.length} — ${steps[current - 1]}`),
      h('div', { className: 'stepper-mobile-track' }, h('div', { className: 'stepper-mobile-fill', style: { width: pct + '%' } }))
    )
  );
}

function FolderTree({ nodes, filesInfo }) {
  return h('div', { className: 'folder-tree' },
    nodes.map((node, i) => h(FolderTreeNode, { key: i, node, filesInfo }))
  );
}

function FolderTreeNode({ node, filesInfo }) {
  const isString = typeof node === 'string';
  const name = isString ? node : node.name;
  const children = isString ? null : node.children;
  const isLeaf = !children || children.length === 0;
  const files = filesInfo && filesInfo[name];
  return h('div', { className: 'folder-tree-node' },
    h('div', { className: cx('folder-tree-row', isLeaf && 'leaf') },
      h('span', { className: 'check' }, isLeaf ? '📄' : '📁'),
      h('span', { style: { flex: 1 } }, name),
      files ? h('span', { className: 'form-help', style: { margin: 0 } }, files, ' fichiers') : (!isLeaf ? null : h('span', { className: 'check' }, '✅'))
    ),
    children && children.length > 0 ? h('div', { className: 'folder-tree-children' },
      children.map((child, i) => h(FolderTreeNode, { key: i, node: child, filesInfo }))
    ) : null
  );
}

// ----------------------------------------------------------- Word export

function downloadWordDoc(filename, title, bodyHtml) {
  const html = `<!DOCTYPE html><html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
  <head><meta charset="utf-8"><title>${title}</title></head>
  <body style="font-family:Calibri, Arial, sans-serif; font-size:12pt; color:#16213A;">${bodyHtml}</body></html>`;
  const blob = new Blob(['﻿', html], { type: 'application/msword' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

  }, []);
  return h('div', { className: 'dropdown-menu-wrap', ref },
    h('button', { className: 'btn btn-secondary btn-sm', onClick: () => setOpen(o => !o) }, label),

class ErrorBoundary extends React.Component {
  constructor(props) { super(props); this.state = { error: null }; }

  render() {
    if (this.state.error) {

    }
    return this.props.children;
  }
}

function DependanceEconomiqueForm({ record, onBack, showToast }) {
  const c = client(record.dossier);
  const [societe, setSociete] = useState(c.nom);
  const [partCA, setPartCA] = useState(record.partHonoraires);
  const [mesures, setMesures] = useState(record.mesures);

  function generer() {
    const html = `
      <h1 style="font-size:16pt;">Note de dépendance économique</h1>
      <p><b>Dossier :</b> ${societe}</p>
      <p><b>Part du chiffre d'affaires du cabinet :</b> ${partCA}%</p>
      <p><b>Seuil d'alerte du cabinet :</b> ${record.seuil}%</p>
      <h2 style="font-size:13pt;">Mesures prises par le cabinet pour garantir son indépendance</h2>
      <p>${mesures.replace(/\n/g, '<br>')}</p>
      <p style="margin-top:24pt; color:#666; font-size:9pt;">Document généré automatiquement par ComplyEC — démonstration.</p>
    `;
    downloadWordDoc(`Dependance_economique_${societe.replace(/\s+/g, '_')}.doc`, 'Note de dépendance économique', html);
    showToast('Document Word généré et téléchargé (démonstration)');
  }

  return h('div', { className: 'page' },
    h('button', { className: 'breadcrumb-back', onClick: onBack }, '← Retour à la conformité'),
    h('div', { className: 'page-header' },
      h('div', null, h('h1', null, 'Dépendance économique'), h('p', { className: 'subtitle' }, `Note pour le dossier ${societe}`))
    ),
    h(Card, { title: 'Informations du dossier' },
      h('div', { className: 'form-group' },
        h('label', { className: 'form-label' }, 'Nom de la société'),
        h('input', { className: 'form-input', value: societe, onChange: e => setSociete(e.target.value) })
      ),
      h('div', { className: 'form-group' },
        h('label', { className: 'form-label' }, "Part du chiffre d'affaires du cabinet"),
        h('div', { className: 'input-with-btn', style: { maxWidth: 160 } },
          h('input', { className: 'form-input', value: partCA, onChange: e => setPartCA(e.target.value) }),
          h('span', { style: { alignSelf: 'center', color: 'var(--text-muted)' } }, '%')
        ),
        h('div', { className: 'form-help' }, `Seuil d'alerte du cabinet : ${record.seuil}%`)
      ),
      h('div', { className: 'form-group' },
        h('label', { className: 'form-label' }, "Mesures prises par le cabinet pour garantir son indépendance"),
        h('textarea', { className: 'form-textarea', style: { minHeight: 130 }, value: mesures, onChange: e => setMesures(e.target.value) })
      ),
      h('div', { style: { display: 'flex', justifyContent: 'flex-end' } },
        h('button', { className: 'btn btn-primary', onClick: generer }, '⬇ Générer le document Word')
      )
    )
  );
}

</script>
<script>
// ComplyEC — Écrans du module Collaborateur
'use strict';

const COLLABORATEUR_CONNECTE = collaborateur('julie');

function mesAnomaliesList() { return ANOMALIES.filter(a => a.collaborateur === COLLABORATEUR_CONNECTE.id); }
function mesDossiersList() { return CLIENTS.filter(c => c.collaborateur === COLLABORATEUR_CONNECTE.id); }

// ============================================================ 0. Vue d'ensemble

function CollabOverview({ navigateCollab, showToast }) {
  const mesDossiers = mesDossiersList();
  const mesAnomalies = mesAnomaliesList();

  const categoriesPortefeuille = CATEGORIES_ANOMALIES
    .map(cat => ({ ...cat, count: mesAnomalies.filter(a => a.categorie === cat.code).length }))
    .filter(c => c.count > 0);

  const dossiersAttention = mesDossiers
    .map(c => ({ client: c, count: mesAnomalies.filter(a => a.dossier === c.id).length }))
    .filter(d => d.count > 0)
    .sort((a, b) => b.count - a.count)
    .slice(0, 5);

  const vigilanceALancer = mesDossiers.filter(c => DOSSIERS_LBCFT.find(d => d.dossier === c.id).statut === 'a_lancer');
  const mesRelancesEnAttente = relancesList().filter(r => r.collaborateur === COLLABORATEUR_CONNECTE.id && r.statut !== 'termine').slice(0, 5);

  return h('div', { className: 'page' },
    h('div', { className: 'page-header' },
      h('div', null, h('h1', null, 'Bonjour Julie 👋'), h('p', { className: 'subtitle' }, "Vue d'ensemble de votre portefeuille"))
    ),
    h('div', { className: 'grid-2', style: { marginBottom: 18 } },
      h(Card, { title: 'Anomalies par catégorie', icon: '📋', iconBg: '#E9F1FE', iconColor: '#2563EB',
        footer: categoriesPortefeuille.length > 0 ? h('button', { className: 'card-link', onClick: () => navigateCollab('dossiers', 'categories') }, 'Voir le détail →') : null },
        categoriesPortefeuille.length > 0 ? categoriesPortefeuille.map(c => h('div', { className: 'list-row', key: c.code },
          h('span', { className: 'list-row-label' }, h(Dot, { color: PRIORITE_COULEURS[c.priorite] }), c.label),
          h('span', { className: 'list-row-value' }, c.count)
        )) : h(EmptyDetail, { icon: '✅', label: 'Aucune anomalie sur votre portefeuille' })
      ),
      h(Card, { title: 'Dossiers nécessitant votre attention', icon: '📁', iconBg: '#FEF3E1', iconColor: '#B45309',
        footer: dossiersAttention.length > 0 ? h('button', { className: 'card-link', onClick: () => navigateCollab('dossiers', 'dossier') }, 'Voir le détail →') : null },
        dossiersAttention.length > 0 ? dossiersAttention.map(d => h('div', { className: 'list-row', key: d.client.id },
          h('span', { className: 'list-row-label' }, d.client.nom),
          h('span', { className: 'list-row-value' }, d.count + ' problème' + (d.count > 1 ? 's' : ''))
        )) : h(EmptyDetail, { icon: '✅', label: 'Tous vos dossiers sont conformes' })
      )
    ),
    h('div', { className: 'grid-2' },
      h(Card, { title: 'Vigilance LBC-FT à traiter', icon: '🔍', iconBg: '#F1EAFE', iconColor: '#7C3AED' },
        vigilanceALancer.length > 0 ? vigilanceALancer.map(c => h('div', { className: 'list-row', key: c.id },
          h('span', { className: 'list-row-label' }, c.nom),
          h(Badge, { color: 'orange' }, '● Analyse à lancer')
        )) : h(EmptyDetail, { icon: '✅', label: 'Toutes les analyses sont à jour' })
      ),
      h(Card, { title: 'Relances en attente', icon: '📨', iconBg: '#FDECEC', iconColor: '#DC2626',
        footer: mesRelancesEnAttente.length > 0 ? h('button', { className: 'card-link', onClick: () => navigateCollab('relances') }, 'Voir le détail →') : null },
        mesRelancesEnAttente.length > 0 ? mesRelancesEnAttente.map(r => h('div', { className: 'list-row', key: r.id },
          h('span', { className: 'list-row-label' }, r.dossierInfo.nom + ' — ' + r.titre),
          h(StatutBadge, { statut: r.statut })
        )) : h(EmptyDetail, { icon: '✅', label: 'Aucune relance en attente' })
      )
    )
  );
}

// ============================================================ 1. Nouveau dossier

function CollabNouveauDossier({ showToast }) {
  const [resetKey, setResetKey] = useState(0);
  return h(ContractualisationWizard, {
    key: resetKey,
    showToast,
    collaborateurConnecte: COLLABORATEUR_CONNECTE,
    onFinish: () => setResetKey(k => k + 1),
  });
}

// ============================================================ 2. Dossiers existants (par catégories / par dossier)

function CollabDossiers({ sub, navigateCollab, showToast }) {
  const current = sub || 'categories';
  const [openedDossier, setOpenedDossier] = useState(null);

  if (openedDossier) {
    return h(DossierExistantDetail, { clientData: openedDossier, onBack: () => setOpenedDossier(null), showToast });
  }

  const tabs = [
    { key: 'categories', label: 'Par catégories' },
    { key: 'dossier', label: 'Par dossier' },
  ];

  return h('div', { className: 'page' },
    h('div', { className: 'page-header' },
      h('div', null, h('h1', null, 'Dossiers existants'), h('p', { className: 'subtitle' }, 'Votre portefeuille — anomalies et suivi, dossier par dossier'))
    ),
    h('div', { className: 'subnav' },
      tabs.map(t => h('button', { key: t.key, className: cx('subnav-btn', current === t.key && 'active'), onClick: () => navigateCollab('dossiers', t.key) }, t.label))
    ),
    current === 'categories' && h(CollabAnomaliesParCategorie, { showToast, onOpenDossier: setOpenedDossier }),
    current === 'dossier' && h(CollabAnomaliesParDossier, { showToast, onOpenDossier: setOpenedDossier })
  );
}

function CollabAnomaliesParCategorie({ showToast, onOpenDossier }) {
  const mesAnomalies = mesAnomaliesList();
  const categories = CATEGORIES_ANOMALIES.map(cat => {
    const items = mesAnomalies.filter(a => a.categorie === cat.code);
    const dossiers = new Set(items.map(a => a.dossier));
    return { ...cat, anomalies: items.length, dossiers: dossiers.size, items };
  }).filter(c => c.anomalies > 0);

  const [selectedCat, setSelectedCat] = useState(null);
  const [selectedAnomalie, setSelectedAnomalie] = useState(null);
  const pagination = usePagination(selectedCat ? selectedCat.items : [], 5);

  if (categories.length === 0) {
    return h('div', { className: 'card' }, h(EmptyDetail, { icon: '✅', label: 'Aucune anomalie sur votre portefeuille — tous vos dossiers sont conformes.' }));
  }

  return h('div', { className: 'split-layout with-detail' },
    h('div', { className: 'card' },
      h('div', { className: 'card-title' }, 'Anomalies de mon portefeuille — par catégorie'),
      h('div', { className: 'table-wrap' },
        h('table', { className: 'data-table' },
          h('thead', null, h('tr', null, ['Catégorie', 'Anomalies', 'Dossiers concernés', 'Priorité', ''].map(c => h('th', { key: c }, c)))),
          h('tbody', null,
            categories.map(c => h('tr', { key: c.code, className: cx('clickable', selectedCat && selectedCat.code === c.code && 'row-selected'), onClick: () => { setSelectedCat(c); setSelectedAnomalie(null); } },
              h('td', { className: 'table-name' }, c.label),
              h('td', null, c.anomalies),
              h('td', null, c.dossiers, ' dossier', c.dossiers > 1 ? 's' : ''),
              h('td', null, h(PriorityBadge, { priorite: c.priorite })),
              h('td', null, h('button', { className: 'btn btn-secondary btn-sm' }, 'Voir le détail'))
            ))
          )
        )
      ),
      selectedCat ? h('div', { style: { marginTop: 18 } },
        h('div', { className: 'card-title' }, `Dossiers concernés — ${selectedCat.label}`),
        h('div', { className: 'table-wrap' },
          h('table', { className: 'data-table' },
            h('thead', null, h('tr', null, ['Dossier', 'Dernière action'].map(c => h('th', { key: c }, c)))),
            h('tbody', null,
              pagination.pageItems.map(a => h('tr', { key: a.id, className: cx('clickable', selectedAnomalie && selectedAnomalie.id === a.id && 'row-selected'), onClick: () => setSelectedAnomalie(a) },
                h('td', { className: 'table-name' }, client(a.dossier).nom),
                h('td', null, a.dernierAction)
              ))
            )
          )
        ),
        h(Pagination, { pagination })
      ) : null
    ),
    h('div', { className: 'detail-panel' },
      selectedAnomalie ? h(CollabAnomalieDetailCard, { anomalie: selectedAnomalie, showToast, onOpenDossier }) :
        h('div', { className: 'card' }, h(EmptyDetail, { label: selectedCat ? 'Sélectionnez un dossier pour voir le détail' : 'Sélectionnez une catégorie pour voir les dossiers concernés' }))
    )
  );
}

function CollabAnomaliesParDossier({ showToast, onOpenDossier }) {
  const mesDossiers = mesDossiersList();
  const mesAnomalies = mesAnomaliesList();
  const dossiers = mesDossiers.map(c => {
    const items = mesAnomalies.filter(a => a.dossier === c.id);
    const priorites = items.map(a => a.priorite);
    const prioriteMax = ['Critique', 'Haute', 'Moyenne', 'Faible'].find(p => priorites.includes(p)) || null;
    return { client: c, items, anomalies: items.length, priorite: prioriteMax };
  }).sort((a, b) => b.anomalies - a.anomalies);

  const [selectedDossier, setSelectedDossier] = useState(null);
  const [selectedAnomalie, setSelectedAnomalie] = useState(null);

  return h('div', { className: 'split-layout with-detail' },
    h('div', { className: 'card' },
      h('div', { className: 'card-title' }, 'Mes dossiers — anomalies par dossier'),
      h('div', { className: 'table-wrap' },
        h('table', { className: 'data-table' },
          h('thead', null, h('tr', null, ['Dossier', 'Anomalies', 'Priorité', ''].map(c => h('th', { key: c }, c)))),
          h('tbody', null,
            dossiers.map(d => h('tr', { key: d.client.id, className: cx('clickable', selectedDossier && selectedDossier.client.id === d.client.id && 'row-selected'), onClick: () => { setSelectedDossier(d); setSelectedAnomalie(null); } },
              h('td', { className: 'table-name' }, d.client.nom),
              h('td', null, d.anomalies),
              h('td', null, d.anomalies > 0 ? h(PriorityBadge, { priorite: d.priorite }) : h(Badge, { color: 'vert' }, '✓ Conforme')),
              h('td', null, h('button', { className: 'btn btn-secondary btn-sm', onClick: e => { e.stopPropagation(); onOpenDossier(d.client); } }, 'Ouvrir le dossier'))
            ))
          )
        )
      ),
      selectedDossier ? h('div', { style: { marginTop: 18 } },
        h('div', { className: 'card-title' }, `Anomalies du dossier ${selectedDossier.client.nom}`),
        selectedDossier.items.length > 0 ? selectedDossier.items.map(a => h('div', { className: 'list-row', key: a.id, style: { cursor: 'pointer' }, onClick: () => setSelectedAnomalie(a) },
          h('span', { className: 'list-row-label' }, h(Dot, { color: PRIORITE_COULEURS[a.priorite] }), a.titre),
          h('span', null, h(PriorityBadge, { priorite: a.priorite }), ' →')
        )) : h(EmptyDetail, { icon: '✅', label: 'Ce dossier est conforme, aucune anomalie.' })
      ) : null
    ),
    h('div', { className: 'detail-panel' },
      selectedAnomalie ? h(CollabAnomalieDetailCard, { anomalie: selectedAnomalie, showToast, onOpenDossier }) :
        h('div', { className: 'card' }, h(EmptyDetail, { label: selectedDossier ? 'Sélectionnez une anomalie pour voir le détail' : 'Sélectionnez un dossier pour voir le détail' }))
    )
  );
}

function CollabAnomalieDetailCard({ anomalie, showToast, onOpenDossier }) {
  const c = client(anomalie.dossier);
  return h('div', { className: 'card' },
    h('div', { className: 'detail-panel-header' }, h('span', { className: 'card-title', style: { margin: 0 } }, 'Détail de l’anomalie'), h(PriorityBadge, { priorite: anomalie.priorite })),
    h('div', { className: 'detail-field' }, h('div', { className: 'detail-field-label' }, 'Anomalie'), h('div', { className: 'detail-field-value' }, anomalie.titre)),
    h('div', { className: 'detail-field' }, h('div', { className: 'detail-field-label' }, 'Dossier'), h('div', { className: 'detail-field-value' }, c.nom)),
    h('div', { className: 'detail-field' }, h('div', { className: 'detail-field-label' }, 'Description'), h('div', { className: 'detail-field-value' }, anomalie.description)),
    h('div', { className: 'detail-field' }, h('div', { className: 'detail-field-label' }, 'Date détectée'), h('div', { className: 'detail-field-value' }, formatDate(anomalie.dateDetection))),
    h('div', { className: 'detail-field' }, h('div', { className: 'detail-field-label' }, 'Dernière action'), h('div', { className: 'detail-field-value' }, anomalie.dernierAction)),
    h('div', { className: 'detail-field' }, h('div', { className: 'detail-field-label' }, "Commentaire de l'expert-comptable"), h('div', { className: 'detail-field-value' }, anomalie.commentaire)),
    h('button', { className: 'btn btn-primary btn-block', style: { marginTop: 6 }, onClick: () => onOpenDossier(c) }, 'Ouvrir le dossier →')
  );
}

// ------------------------------------------------------ Détail d'un dossier (4 onglets)

function DossierExistantDetail({ clientData, onBack, showToast }) {
  const [tab, setTab] = useState('ldm');
  const tabs = [
    { key: 'ldm', label: 'Lettres de mission' },
    { key: 'pieces', label: 'Pièces justificatives' },
    { key: 'drive', label: 'Arborescence Drive' },
    { key: 'lbcft', label: 'Vigilance LBC-FT' },
  ];
  return h('div', { className: 'page' },
    h('button', { className: 'breadcrumb-back', onClick: onBack }, '← Retour'),
    h('div', { className: 'page-header' },
      h('div', null, h('h1', null, clientData.nom), h('p', { className: 'subtitle' }, `${clientData.forme} — ${clientData.dirigeant} — ${clientData.activite}`))
    ),
    h('div', { className: 'tabs' },
      tabs.map(t => h('button', { key: t.key, className: cx('tab-btn', tab === t.key && 'active'), onClick: () => setTab(t.key) }, t.label))
    ),
    tab === 'ldm' && h(TabLettresMission, { clientData, showToast }),
    tab === 'pieces' && h(TabPiecesJustificatives, { clientData, showToast }),
    tab === 'drive' && h(TabArborescenceDrive, { clientData }),
    tab === 'lbcft' && h(TabVigilanceLBCFT, { clientData, showToast })
  );
}

function TabLettresMission({ clientData, showToast }) {
  return h('div', { className: 'grid-2' },
    h(Card, { title: 'Lettre de mission en vigueur' },
      h('div', { className: 'kv-line' }, h('span', { className: 'k' }, 'Statut'), h(Badge, { color: 'vert' }, '● Signée')),
      h('div', { className: 'kv-line' }, h('span', { className: 'k' }, 'Type de mission'), h('span', { className: 'v' }, 'Présentation + social')),
      h('div', { className: 'kv-line' }, h('span', { className: 'k' }, 'Signataire'), h('span', { className: 'v' }, 'Julien Lesnes')),
      h('div', { className: 'kv-line' }, h('span', { className: 'k' }, 'Honoraires mensuels HT'), h('span', { className: 'v' }, '350 €')),
      h('div', { className: 'kv-line' }, h('span', { className: 'k' }, 'Montant du bulletin'), h('span', { className: 'v' }, '18 €/salarié')),
      h('div', { className: 'kv-line' }, h('span', { className: 'k' }, 'Date de signature'), h('span', { className: 'v' }, '15/09/2025')),
      h('div', { style: { display: 'flex', gap: 10, marginTop: 14, flexWrap: 'wrap' } },
        h('button', { className: 'btn btn-secondary btn-sm', onClick: () => showToast('Téléchargement du PDF (démonstration)') }, '⬇ Télécharger le PDF'),
        h('button', { className: 'btn btn-secondary btn-sm', onClick: () => showToast('Nouvel avenant préparé (démonstration)') }, '📝 Générer un avenant')
      )
    ),
    h(Card, { title: 'Historique des versions' },
      h('div', { className: 'list-row' }, h('span', null, 'Lettre de mission — v1'), h(Badge, { color: 'vert' }, 'Signée le 15/09/2025')),
      h('div', { className: 'list-row' }, h('span', null, 'Devis initial'), h(Badge, { color: 'gris' }, 'Archivé'))
    )
  );
}

function TabPiecesJustificatives({ clientData, showToast }) {
  const anomaliesDossier = ANOMALIES.filter(a => a.dossier === clientData.id && (a.categorie === 'piece_expiree' || a.categorie === 'document_manquant'));
  const piecesStandard = [
    { label: "Pièce d'identité (CNI) du dirigeant", match: 'identité', statut: 'ok' },
    { label: 'KBIS de moins de 3 mois', match: 'kbis', statut: 'ok' },
    { label: 'Attestation PPE', match: 'ppe', statut: 'ok' },
    { label: 'Registre des bénéficiaires effectifs (RBE)', match: 'néficiaires', statut: 'ok' },
  ];
  anomaliesDossier.forEach(a => {
    const idx = piecesStandard.findIndex(p => a.titre.toLowerCase().includes(p.match));
    if (idx >= 0) piecesStandard[idx].statut = 'probleme';
  });
  return h(Card, { title: 'Pièces justificatives du dossier permanent' },
    piecesStandard.map((p, i) => h('div', { className: 'list-row', key: i },
      h('span', { className: 'list-row-label' }, h(Dot, { color: p.statut === 'ok' ? 'vert' : 'rouge' }), p.label),
      p.statut === 'ok' ? h(Badge, { color: 'vert' }, '✓ Conforme') : h('button', { className: 'btn btn-secondary btn-sm', onClick: () => showToast('Demande de mise à jour envoyée au client (démonstration)') }, 'Demander au client')
    ))
  );
}

function TabArborescenceDrive({ clientData }) {
  return h(Card, { title: `Arborescence Drive — ${clientData.nom}` },
    h(FolderTree, { nodes: DRIVE_TREE })
  );
}

function TabVigilanceLBCFT({ clientData, showToast }) {
  const [lancement, setLancement] = useState(false);
  const record = DOSSIERS_LBCFT.find(d => d.dossier === clientData.id);
  const aLancer = record.statut === 'a_lancer' && !lancement;

  if (aLancer) {
    return h(Card, { title: 'Vigilance LBC-FT' },
      h('div', { className: 'empty-detail', style: { padding: '30px 10px' } },
        h('div', { className: 'empty-icon' }, '🔍'),
        h('div', null, "Aucune analyse de vigilance n'a encore été réalisée pour ce dossier."),
        h('button', { className: 'btn btn-primary', style: { marginTop: 14 }, onClick: () => setLancement(true) }, "Lancer l'analyse →")
      )
    );
  }

  const niveau = lancement ? 'Faible' : record.niveauRetenu;
  return h(Card, { title: 'Vigilance LBC-FT' },
    h('div', { className: 'kv-line' }, h('span', { className: 'k' }, 'Niveau proposé'), h(Badge, { color: niveau === 'Faible' ? 'vert' : 'rouge' }, niveau)),
    h('div', { className: 'kv-line' }, h('span', { className: 'k' }, 'Niveau retenu'), h(Badge, { color: niveau === 'Faible' ? 'vert' : 'rouge' }, niveau)),
    h('div', { className: 'kv-line' }, h('span', { className: 'k' }, 'Dernière analyse'), h('span', { className: 'v' }, formatDate(record.derniereAnalyse))),
    h('button', { className: 'btn btn-secondary btn-sm', style: { marginTop: 14 }, onClick: () => showToast('Analyse LBC-FT relancée (démonstration)') }, '🔄 Relancer une analyse')
  );
}

// ============================================================ 3. Note de synthèse annuelle

function CollabNoteSynthese({ showToast }) {
  const mesDossiers = mesDossiersList();
  const [selected, setSelected] = useState(null);

  if (selected) {
    return h(NoteSyntheseForm, { clientData: selected, onBack: () => setSelected(null), showToast });
  }

  return h('div', { className: 'page' },
    h('div', { className: 'page-header' },
      h('div', null, h('h1', null, 'Note de synthèse annuelle'), h('p', { className: 'subtitle' }, 'Préparez et transmettez la note de synthèse de fin de mission pour chacun de vos dossiers'))
    ),
    h('div', { className: 'card' },
      h('div', { className: 'table-wrap' },
        h('table', { className: 'data-table' },
          h('thead', null, h('tr', null, ['Dossier', 'Exercice', 'Statut', ''].map(c => h('th', { key: c }, c)))),
          h('tbody', null,
            mesDossiers.map(c => {
              const bilan = BILAN_DOSSIERS.find(b => b.dossier === c.id);
              return h('tr', { key: c.id, className: 'clickable', onClick: () => setSelected(c) },
                h('td', { className: 'table-name' }, c.nom),
                h('td', null, '2025'),
                h('td', null, bilan ? h(Badge, { color: 'vert' }, '● Transmise le ' + formatDate(bilan.datePreparation)) : h(Badge, { color: 'orange' }, '● Brouillon à transmettre')),
                h('td', null, h('button', { className: 'btn btn-secondary btn-sm', onClick: e => { e.stopPropagation(); setSelected(c); } }, 'Ouvrir'))
              );
            })
          )
        )
      )
    )
  );
}

function NoteSyntheseForm({ clientData, onBack, showToast }) {
  const bilan = BILAN_DOSSIERS.find(b => b.dossier === clientData.id);
  const [champs, setChamps] = useState(() => ({
    rentabilite: bilan ? bilan.rentabilite.label : '',
    problemes: bilan ? (bilan.problemes.description || bilan.problemes.label) : '',
    continuite: bilan ? bilan.continuite.label : '',
    sujets: bilan ? bilan.sujets : '',
  }));

  return h('div', { className: 'page' },
    h('button', { className: 'breadcrumb-back', onClick: onBack }, '← Retour à la liste'),
    h('div', { className: 'page-header' },
      h('div', null, h('h1', null, clientData.nom), h('p', { className: 'subtitle' }, 'Note de synthèse — Exercice 2025'))
    ),
    h(Card, {
      footer: h('div', { style: { display: 'flex', justifyContent: 'flex-end', gap: 10, marginTop: 16 } },
        h('button', { className: 'btn btn-secondary', onClick: () => showToast('Brouillon enregistré (démonstration)') }, '💾 Enregistrer le brouillon'),
        h('button', { className: 'btn btn-primary', onClick: () => { showToast('Note de synthèse transmise à l’expert-comptable (démonstration)'); onBack(); } }, "Transmettre à l'expert-comptable →")
      ) },
      bilan ? h(Badge, { color: 'vert' }, '● Déjà transmise le ' + formatDate(bilan.datePreparation)) : h(Badge, { color: 'orange' }, '● Brouillon non transmis'),
      h('div', { style: { marginTop: 14 } },
        NOTE_SYNTHESE_CHAMPS.map(f => h('div', { className: 'form-group', key: f.code },
          h('label', { className: 'form-label' }, f.label),
          h('textarea', { className: 'form-textarea', style: { minHeight: 60 }, value: champs[f.code], onChange: e => setChamps(prev => ({ ...prev, [f.code]: e.target.value })) })
        ))
      ),
      bilan && bilan.commentaireEC ? h('div', { className: 'comment-box', style: { marginTop: 6 } },
        h('div', { className: 'comment-box-title' }, "🧑‍💼 Réponse de l'expert-comptable"),
        h('p', null, bilan.commentaireEC),
        h('div', { className: 'comment-date' }, '📅 ', formatDate(bilan.dateCommentaireEC))
      ) : null
    )
  );
}

// ============================================================ 4. Relances et suivi

function CollabRelances({ showToast }) {
  const mesRelances = relancesList().filter(r => r.collaborateur === COLLABORATEUR_CONNECTE.id);
  const [statuts, setStatuts] = useState(() => Object.fromEntries(mesRelances.map(r => [r.id, r.statut])));
  const [selected, setSelected] = useState(null);

  function updateStatut(id, statut) { setStatuts(prev => ({ ...prev, [id]: statut })); showToast('Statut mis à jour (démonstration)'); }

  const aFaire = mesRelances.filter(r => statuts[r.id] === 'a_faire').length;
  const enCours = mesRelances.filter(r => statuts[r.id] === 'en_cours' || statuts[r.id] === 'en_retard').length;

  return h('div', { className: 'page' },
    h('div', { className: 'page-header' },
      h('div', null, h('h1', null, 'Relances & suivi'), h('p', { className: 'subtitle' }, "Suivi des actions demandées par l'expert-comptable"))
    ),
    h('div', { className: 'counter-row' },
      h('div', { className: 'counter-card' }, h('span', { className: 'counter-icon' }, '📨'), h('div', null, h('div', { className: 'counter-value' }, mesRelances.length), h('div', { className: 'counter-label' }, 'Demandes reçues'))),
      h('div', { className: 'counter-card' }, h('span', { className: 'counter-icon' }, '⏰'), h('div', null, h('div', { className: 'counter-value' }, aFaire), h('div', { className: 'counter-label' }, 'À faire'))),
      h('div', { className: 'counter-card' }, h('span', { className: 'counter-icon' }, '🔄'), h('div', null, h('div', { className: 'counter-value' }, enCours), h('div', { className: 'counter-label' }, 'En cours / en retard')))
    ),
    h('div', { className: 'split-layout with-detail' },
      h('div', { className: 'card' },
        h('div', { className: 'card-title' }, "Relances demandées par l'expert-comptable"),
        h('div', { className: 'table-wrap' },
          h('table', { className: 'data-table' },
            h('thead', null, h('tr', null, ['Client', 'Objet de la relance', 'Date demande EC', 'Statut', ''].map(c => h('th', { key: c }, c)))),
            h('tbody', null,
              mesRelances.map(r => h('tr', { key: r.id, className: cx('clickable', selected && selected.id === r.id && 'row-selected'), onClick: () => setSelected(r) },
                h('td', { className: 'table-name' }, r.dossierInfo.nom),
                h('td', null, r.titre),
                h('td', null, formatDate(r.dateDemandeEC)),
                h('td', null, h('select', {
                  className: 'form-select', style: { width: 130 }, value: statuts[r.id],
                  onClick: e => e.stopPropagation(),
                  onChange: e => updateStatut(r.id, e.target.value),
                }, Object.entries(STATUT_LABELS).map(([k, v]) => h('option', { key: k, value: k }, v.label)))),
                h('td', null, h('button', { className: 'btn btn-secondary btn-sm', onClick: e => { e.stopPropagation(); setSelected(r); } }, 'Voir'))
              ))
            )
          )
        )
      ),
      h('div', { className: 'detail-panel' },
        selected ? h('div', { className: 'card' },
          h('div', { className: 'detail-panel-header' }, h('span', { className: 'card-title', style: { margin: 0 } }, 'Détail de la relance'), h(StatutBadge, { statut: statuts[selected.id] })),
          h('div', { className: 'detail-field' }, h('div', { className: 'detail-field-label' }, 'Anomalie'), h('div', { className: 'detail-field-value' }, selected.titre)),
          h('div', { className: 'detail-field' }, h('div', { className: 'detail-field-label' }, 'Dossier'), h('div', { className: 'detail-field-value' }, selected.dossierInfo.nom)),
          h('div', { className: 'detail-field' }, h('div', { className: 'detail-field-label' }, 'Date demande EC'), h('div', { className: 'detail-field-value' }, formatDate(selected.dateDemandeEC))),
          h('div', { className: 'detail-field' }, h('div', { className: 'detail-field-label' }, 'Description'), h('div', { className: 'detail-field-value' }, selected.description)),
          h('div', { className: 'detail-field' }, h('div', { className: 'detail-field-label' }, "Commentaire de l'expert-comptable"), h('div', { className: 'detail-field-value' }, selected.commentaire)),
          h('div', { className: 'form-group', style: { marginTop: 4 } },
            h('label', { className: 'form-label' }, 'Mettre à jour le statut'),
            h('select', { className: 'form-select', value: statuts[selected.id], onChange: e => updateStatut(selected.id, e.target.value) },
              Object.entries(STATUT_LABELS).map(([k, v]) => h('option', { key: k, value: k }, v.label))
            )
          ),
          h('button', { className: 'btn btn-primary btn-block', style: { marginTop: 10 }, onClick: () => updateStatut(selected.id, 'termine') }, '✅ Marquer comme régularisé')
        ) : h('div', { className: 'card' }, h(EmptyDetail, { label: 'Sélectionnez une relance pour voir le détail' }))
      )
    ),
    h('div', { className: 'form-help', style: { marginTop: 10 } }, 'ℹ️ Le statut est renseigné par le collaborateur et visible par l’expert-comptable en temps réel.')
  );
}

</script>
<script>
// ComplyEC — Point d'entrée de l'application
'use strict';

function App() {
  const [space, setSpace] = useState(null);
  const [ecSection, setEcSection] = useState('overview');
  const [ecSub, setEcSub] = useState(null);
  const [ecBilanFocus, setEcBilanFocus] = useState(null);
  const [collabSection, setCollabSection] = useState('overview');
  const [collabSub, setCollabSub] = useState(null);
  const [toastNode, showToast] = useToast();

  function navigateEc(section, sub) {
    setEcSection(section);
    setEcSub(sub);
    window.scrollTo(0, 0);
  }

  function navigateCollab(section, sub) {
    setCollabSection(section);
    setCollabSub(sub || null);
    window.scrollTo(0, 0);
  }

  function openBilanFor(dossierId) {
    setEcBilanFocus(dossierId);
    setEcSection('bilan');
    setEcSub(null);
    window.scrollTo(0, 0);
  }

  if (!space) {
    return h(SpaceSelector, { onSelect: setSpace });
  }

  const user = space === 'ec' ? { nom: EXPERT_COMPTABLE.nom, role: EXPERT_COMPTABLE.role, initiales: EXPERT_COMPTABLE.initiales } : { nom: 'Julie Bernard', role: 'Collaboratrice comptable', initiales: 'JB' };

  let content;
  if (space === 'ec') {
    if (ecSection === 'overview') content = h(ECOverview, { navigateEc, showToast });
    else if (ecSection === 'entree-mission') {
      content = ecSub === 'contractualisation'
        ? h(ContractualisationWizard, { key: 'ec-contract', showToast, collaborateurConnecte: collaborateur('julie'), onFinish: () => navigateEc('overview', null) })
        : h(ReprisePage, { showToast });
    }
    else if (ecSection === 'bilan') content = h(ECBilan, { key: ecBilanFocus || 'bilan', showToast, focusDossier: ecBilanFocus, onFocusHandled: () => setEcBilanFocus(null) });
    else if (ecSection === 'anomalies') content = h(ECAnomalies, { sub: ecSub, navigateEc, showToast, onOpenBilan: openBilanFor });
    else if (ecSection === 'conformite') content = h(ECConformite, { showToast });
    else content = h(ECOverview, { navigateEc, showToast });
  } else {
    if (collabSection === 'overview') content = h(CollabOverview, { navigateCollab, showToast });
    else if (collabSection === 'nouveau') content = h(CollabNouveauDossier, { showToast });
    else if (collabSection === 'dossiers') content = h(CollabDossiers, { sub: collabSub, navigateCollab, showToast });
    else if (collabSection === 'synthese') content = h(CollabNoteSynthese, { showToast });
    else if (collabSection === 'relances') content = h(CollabRelances, { showToast });
    else content = h(CollabOverview, { navigateCollab, showToast });
  }

  return h('div', { className: 'app-shell' },
    h(Sidebar, {
      space,
      section: space === 'ec' ? ecSection : collabSection,
      sub: space === 'ec' ? ecSub : collabSub,
      onNavigate: space === 'ec' ? navigateEc : navigateCollab,
      onSwitchSpace: () => setSpace(null),
      user,
    }),
    h('div', { className: 'main-area' }, content),
    toastNode
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(h(ErrorBoundary, null, h(App)));

</script>
</body>
